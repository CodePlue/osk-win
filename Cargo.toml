[workspace]
resolver = "2"
members = ["core", "osk-win", "oskwin-verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["osk"]

[workspace.dependencies]
oskwin-core = { path = "core" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_Graphics_Dwm"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1
