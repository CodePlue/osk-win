[package]
name = "osk-win"
description = "Windows on-screen keyboard: the Linux osk core and painters on a topmost Win32 window, GDI rendering and SendInput injection."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
oskwin-core = { workspace = true }
windows = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tiny-skia = "0.11"
fontdue = "0.9"
cpal = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[features]
default = ["neural", "dictation"]
neural = ["oskwin-core/neural"]
dictation = ["dep:cpal", "dep:whisper-rs"]
